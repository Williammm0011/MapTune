[gradmap]
gradmap_dir   = "third_party/gradmap"
bench_dir     = "benchmarks_gradmap"
lib           = "libs/asap7_libcell_info_75t_R.txt"
default_steps = 200

[gradmap.optimizer]
loss_type                 = "ADP"
eval_backend              = "gpu"
area_factor               = 1.0
delay_factor              = 1.0
learning_rate             = 0.15
eval_interval             = 10
softmax_temperature_start = 1.0
softmax_temperature_end   = 0.8
plateau_enable            = true
plateau_patience          = 6
plateau_threshold         = 0.003
plateau_factor            = 0.5
plateau_min_lr            = 0.01
restore_best_on_plateau   = true

[gradmap.circuit]
init_weights_strategy = "from_abc"
abc_boost_value       = 2.0

[benchmarks]
gradmap = [
  "adder", "arbiter", "bar", "cavlc", "ctrl", "dec", "div", "hyp",
  "i2c", "int2float", "log2", "max", "mem_ctrl", "multiplier",
  "priority", "router", "sin", "sqrt", "square", "voter",
]
